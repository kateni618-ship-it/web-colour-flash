<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>web-colour-flash — one-click HTML recolouring</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="app">

  <!-- ── Header ─────────────────────────────────────────────── -->
  <header class="header">
    <div class="header-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 2a10 10 0 0 1 0 20"/>
        <path d="M2 12h20"/>
        <path d="M12 2c-2.76 3.1-4 6.4-4 10s1.24 6.9 4 10"/>
      </svg>
      web-colour-flash
    </div>
    <span class="header-tagline">上传 HTML · 生成配色 · 复制使用</span>

    <!-- Compare / Restore buttons (shown after first generate) -->
    <div class="header-actions" id="header-actions" style="display:none" aria-label="预览操作">
      <button id="btn-compare" class="btn-ghost" aria-label="对比原稿">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="9" height="18" rx="1"/>
          <rect x="13" y="3" width="9" height="18" rx="1"/>
        </svg>
        <span class="btn-ghost-text">对比原稿</span>
      </button>
      <button id="btn-restore" class="btn-ghost" aria-label="恢复原稿配色">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        <span class="btn-ghost-text">恢复原稿</span>
      </button>
    </div>
  </header>

  <!-- ── Left panel ─────────────────────────────────────────── -->
  <aside class="panel" role="complementary" aria-label="Controls">

    <!-- Upload -->
    <div class="upload-zone" id="upload-zone" role="button" tabindex="0" aria-label="Upload HTML file">
      <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <p class="upload-hint" id="upload-hint">
        拖放 HTML 文件到此处
        <span>或点击选择文件</span>
      </p>
      <input type="file" id="file-input" accept=".html,.htm" style="display:none" aria-hidden="true">
    </div>

    <!-- Extracted color strip -->
    <div class="section-label" id="extracted-label" style="display:none">提取的颜色</div>
    <div class="extracted-strip" id="extracted-strip"></div>

    <!-- Palette swatches -->
    <div class="section-label">调色盘</div>
    <div id="swatch-container" aria-label="Color palette">
      <!-- Populated by app.js -->
    </div>

    <p id="no-file-msg" style="display:none">
      上传 HTML 文件以提取颜色，或直接点击生成开始创作。
    </p>

    <div class="divider"></div>

    <!-- Controls -->
    <div class="section-label">设置</div>
    <div class="controls">

      <!-- Harmony -->
      <div class="control-row">
        <span class="control-label">和谐</span>
        <select id="harmony-select" class="select" aria-label="Color harmony type">
          <!-- Options added by app.js -->
        </select>
      </div>

      <!-- Creativity -->
      <div class="control-row">
        <span class="control-label">随机度</span>
        <div class="range-wrap">
          <input type="range" id="creativity-range" class="range"
                 min="0" max="100" value="50"
                 aria-label="Creativity level">
          <span class="range-val" id="creativity-val">50</span>
        </div>
      </div>

      <!-- Dark mode hint -->
      <div class="control-row">
        <span class="control-label">深色背景</span>
        <label class="toggle-wrap" for="dark-mode-toggle" aria-label="生成深色背景调色盘">
          <input type="checkbox" id="dark-mode-toggle" class="toggle-input">
          <span class="toggle-track">
            <span class="toggle-thumb"></span>
          </span>
          <span class="toggle-label-text">深色模式</span>
        </label>
      </div>

      <!-- Font family -->
      <div class="control-row">
        <span class="control-label">字体</span>
        <select id="font-select" class="select" aria-label="字体选择">
          <!-- Options added by app.js -->
        </select>
      </div>

    </div>

    <div class="divider"></div>

    <!-- Actions -->
    <div class="actions">

      <button id="btn-generate" class="btn btn-generate" aria-label="生成新调色盘 (G)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
        </svg>
        生成
      </button>

      <p class="shortcut-hint">按 <kbd>G</kbd> 键生成</p>

      <div class="btn-row">
        <button id="btn-copy-css" class="btn btn-secondary" disabled aria-label="复制为 CSS 变量">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          CSS 变量
        </button>
        <button id="btn-copy-json" class="btn btn-secondary" disabled aria-label="复制为 JSON">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          JSON
        </button>
      </div>

      <button id="btn-download" class="btn btn-secondary" disabled aria-label="下载重新配色的 HTML 文件">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        下载 HTML
      </button>

    </div>

    <div class="panel-spacer"></div>

  </aside>

  <!-- ── Preview panel ───────────────────────────────────────── -->
  <main class="preview-panel" role="main" aria-label="HTML preview">
    <iframe id="preview-frame"
            sandbox="allow-scripts allow-same-origin"
            title="HTML preview"
            aria-label="Preview of uploaded HTML with applied palette">
    </iframe>
    <div class="preview-placeholder" id="preview-placeholder" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M3 9h18M9 21V9"/>
      </svg>
      <p>
        <strong>上传 HTML 文件开始使用</strong>
        将网站、仪表盘或产品 HTML 文件拖放到左侧面板，
        点击「生成」即可重新混搭配色方案。
      </p>
    </div>
  </main>

</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
